   <script>
        async function registrar() {
            const { error } = await supabase.auth.signUp({
                email: val('email'),
                password: val('pass')
            });

            if (error) {
                return msg('m1', 'Error: ' + error.message, false);
            }

            msg('m1', 'Cuenta creada. Ya puedes iniciar sesión.', true);
        }

        async function entrar() {
            const { error } = await supabase.auth.signInWithPassword({
                email: val('email'),
                password: val('pass')
            });

            if (error) {
                return msg('m1', 'Credenciales incorrectas', false);
            }

            mostrarApp();
        }

       
(async () => {
    const { data: { session } } =
        await supabase.auth.getSession();

    if (session) {
        mostrarApp();
    }
})();
    </script>
